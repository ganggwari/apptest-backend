# Existing GitHub-connected Render Docker Web Service: backend only.
# Use Render dashboard Environment for all secrets; this blueprint is optional.
services:
  - type: web
    name: apptest-backend-tj3a
    runtime: docker
    plan: free
    healthCheckPath: /api/navigation/config
    envVars:
      - {key: SECRET_DB_URL, sync: false}
      - {key: SECRET_DB_USERNAME, sync: false}
      - {key: SECRET_DB_PASSWORD, sync: false}
      - {key: SECRET_INTERNAL_API_KEY, sync: false}
      - {key: PUF_OCR_MODE, value: stub}
      - {key: PUF_DEMO_ENABLED, value: "true"}
      - {key: PUF_CORS_ALLOWED_ORIGINS, value: "https://apptest-front.onrender.com"}
      - {key: SERVER_SERVLET_SESSION_COOKIE_SECURE, value: "true"}
      - {key: SERVER_SERVLET_SESSION_COOKIE_SAME_SITE, value: none}
      - {key: SECRET_KAKAO_REST_KEY, sync: false}
      - {key: SECRET_KAKAO_JS_KEY, sync: false}
      - {key: SECRET_KMA_SERVICE_KEY, sync: false}
      - {key: PUF_FCM_ENABLED, value: "true"}
      - {key: SECRET_FCM_CREDENTIALS_JSON, sync: false}
      - {key: SECRET_FCM_WEB_API_KEY, sync: false}
      - {key: SECRET_FCM_WEB_PROJECT_ID, sync: false}
      - {key: SECRET_FCM_WEB_SENDER_ID, sync: false}
      - {key: SECRET_FCM_WEB_APP_ID, sync: false}
      - {key: SECRET_FCM_WEB_VAPID_KEY, sync: false}
      - {key: PUF_PM_BACKFILL_ON_STARTUP, value: "false"}
      - {key: PUF_PM_SENSOR_STUB_ENABLED, value: "false"}
      - {key: SECRET_GEMINI_API_KEY, sync: false}
      - {key: PUF_GEMINI_MODEL, value: gemini-3.5-flash-lite}
      - {key: PUF_DEMO_MODEL_STUB_ENABLED, value: "true"}
      - {key: PUF_DEMO_CALM_SCORE_MINUTES, value: "1"}
      - {key: PUF_DEMO_CALM_WATER_MINUTES, value: "1"}
